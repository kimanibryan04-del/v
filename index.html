<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message ❤️- Sasha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body, html { height: 100%; margin: 0; font-family: 'Poppins', sans-serif; overflow: hidden; }

        /* Ultra-Colorful Mesh Gradient Background */
        .bg-colorful {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #ff9a9e;
            background-image:
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%),
                radial-gradient(at 0% 50%, hsla(339,49%,30%,1) 0, transparent 50%),
                radial-gradient(at 100% 50%, hsla(225,39%,30%,1) 0, transparent 50%),
                radial-gradient(at 0% 100%, hsla(339,49%,30%,1) 0, transparent 50%),
                radial-gradient(at 50% 100%, hsla(225,39%,30%,1) 0, transparent 50%),
                radial-gradient(at 100% 100%, hsla(253,16%,7%,1) 0, transparent 50%);
            background-size: 200% 200%;
            animation: meshMove 10s ease infinite;
        }

        /* Bright Pink/Purple Alternative Gradient (uncomment if you want brighter neon colors) */
        /* .bg-colorful {
            background: linear-gradient(45deg, #ff00cc, #3333ff, #00ffcc, #ffcc00);
            background-size: 600% 600%;
            animation: meshMove 8s linear infinite;
        } */

        @keyframes meshMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 2.5rem;
            color: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .poem-text {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .btn-love {
            background: #ff4d6d;
            border: none;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-love:hover {
            background: #ff758f;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
        }

        #noButton { position: absolute; transition: 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .hidden { display: none !important; }
    </style>

</head>
<body>
    <div class="bg-colorful"></div>

    <div class="container h-100 d-flex justify-content-center align-items-center">
        <div id="poemStep" class="glass-card p-5 text-center shadow-lg">
            <h2 class="mb-4 fw-bold">Before the Day Arrives...</h2>
            <p class="poem-text mb-4">
                The stars are bright, but your eyes shine more,<br>
                A love like ours is what I adore.<br>
                Before the roses and chocolates arrive,<br>
                It's your beautiful soul that makes me thrive.
            </p>
            <button class="btn btn-love btn-lg rounded-pill px-5" onclick="goToQuestion()">Read More ✨</button>
        </div>

        <div id="questionStep" class="glass-card p-5 text-center shadow-lg hidden">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpobjZ0NjZueXpueXpueXpueXpueXpueXpueXpueXpueXpueXpueSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" width="150" class="mb-4 rounded-circle">
            <h1 class="display-5 fw-bold mb-5">Will you be my Valentine?</h1>
            <div class="d-flex justify-content-center gap-3">
                <button class="btn btn-success btn-lg rounded-pill px-5" onclick="celebrate()">Yes!</button>
                <button id="noButton" class="btn btn-outline-light btn-lg rounded-pill px-5" onmouseover="dodge()">No</button>
            </div>
        </div>

        <div id="celebrationStep" class="glass-card p-5 text-center shadow-lg hidden">
            <h1 class="display-4 fw-bold mb-3">Yay! 🥰</h1>
            <p class="fs-3">I knew you'd say yes! I love you!</p>
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3pueXpueXpueXpueXpueXpueXpueXpueXpueXpueXpueXpueXpueSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/L2z7uLXpgr1P3P3Pz1/giphy.gif" width="200" class="mt-3">
        </div>
    </div>

    <script>
        function goToQuestion() {
            document.getElementById('poemStep').classList.add('hidden');
            document.getElementById('questionStep').classList.remove('hidden');
        }

        function dodge() {
            const btn = document.getElementById('noButton');
            const padding = 50;
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - padding);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - padding);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('questionStep').classList.add('hidden');
            document.getElementById('celebrationStep').classList.remove('hidden');
